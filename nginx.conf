server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;

    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # QR de las placas: ayemi.org/p/<corto> → su tarjeta en /pcb. Temporal a
    # propósito: la dirección corta está impresa, el destino puede cambiar.
    # Debe coincidir con `corto` en src/config/placas.js y con vercel.json.
    location ~ ^/p/328/?$   { return 302 "/pcb#atmega328p"; }
    location ~ ^/p/esp32/?$ { return 302 "/pcb#esp32"; }
    location ~ ^/p/stm32/?$ { return 302 "/pcb#stm32"; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}